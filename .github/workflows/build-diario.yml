# Reconstruye el sitio y lo publica cada día, en los servidores de GitHub, para
# que la web se actualice sola aunque el portátil de Daniel esté apagado. Antes
# esto lo hacía la tarea programada local "build-diario", que solo corría con la
# app de Claude Code abierta — poco fiable para un medio ya lanzado.
#
# El bot de Telegram sigue viviendo en Railway (24/7); esto es solo el build del
# sitio. Al hacer push, Vercel despliega solo (integración de Git de Vercel).
#
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY          redacción con IA (sin ella cae al redactor por reglas)
#   SUPABASE_URL               fotos, esquelas, archivo y comentarios de vecinos
#   SUPABASE_SERVICE_ROLE_KEY  ídem
#   LLM_MODEL, LLM_PROVIDER     opcionales, configuración del modelo

name: Build diario

on:
  schedule:
    - cron: "10 6 * * *"   # 06:10 UTC ≈ 08:10 hora peninsular (varía una hora con el cambio de hora)
  workflow_dispatch: {}     # permite lanzarlo a mano desde la pestaña Actions

concurrency:
  group: build-diario
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 20 minutos se quedaban cortos: 3 de los 7 builds programados entre el
    # 2026-07-28 y el 2026-08-03 se cancelaron al chocar con el límite (20,3 /
    # 20,4 min) y varios más acabaron a 19,9 — al filo. La web se quedaba sin
    # actualizar en silencio, porque una ejecución cancelada no avisa.
    # Con la caché de IA los builds deberían bajar mucho, pero el margen tiene
    # que cubrir un día con mucha noticia nueva o una fuente lenta.
    timeout-minutes: 40
    permissions:
      contents: write        # para poder hacer push del sitio regenerado
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Recuperar la caché de textos de IA
        # SIN ESTO EL BUILD DIARIO CUESTA ~5x MÁS. sitegen/cache.py guarda por
        # hash lo que ya ha redactado la IA (titulares, entradillas, el tiempo)
        # para no volver a pagarlo en cada build. Esa caché vive en data/cache/,
        # que está en .gitignore — así que sin este paso el Action arrancaba cada
        # día en blanco y volvía a redactar ~215 textos que no habían cambiado,
        # incluidos plenos y ayudas de hace semanas.
        #
        # La clave lleva el id de la ejecución para que cada build guarde una
        # entrada nueva (las de GitHub son inmutables); restore-keys recupera la
        # más reciente. Con un build al día no expira: GitHub solo descarta las
        # que pasan 7 días sin usarse.
        uses: actions/cache@v4
        with:
          path: data/cache
          key: ia-cache-${{ github.run_id }}
          restore-keys: ia-cache-

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar el navegador de Playwright
        # Necesario para scrapers/plenos_sedelectronica.py: el listado de actas
        # es una llamada AJAX de Wicket con token de sesión firmado, así que hace
        # falta un navegador de verdad (ver el docstring de ese módulo).
        # Sin este paso el build salía cada día con "aviso: sin actas de pleno
        # para Mayorga" y el pueblo se quedaba sin sus plenos. Añade ~1 min.
        run: python -m playwright install --with-deps chromium

      - name: Refrescar la cola de pistas del radar
        # Cola interna (data/radar/, en .gitignore): no se publica, solo alimenta
        # la revisión. Si falla una fuente no pasa nada.
        run: python -m scrapers.radar_noticias --guardar || true

      - name: Reconstruir el sitio
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python -m sitegen.build

      - name: Boletín diario en el canal de Telegram
        # Va DESPUÉS del build (necesita data/boletin_hoy.json, que escribe él) y
        # con continue-on-error a propósito: que Telegram esté caído no puede
        # impedir que el sitio se publique. Si no hay nada nuevo, el script no
        # envía nada — el canal calla en vez de mandar un boletín vacío.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python -m scripts.boletin_telegram

      - name: Publicar si hay cambios
        run: |
          git config user.name "El Terracampino (bot)"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
            exit 0
          fi
          git commit -m "Actualización diaria automática"
          # Reintegrar lo que haya entrado mientras compilábamos (un build tarda
          # ~15 min: da tiempo de sobra a que alguien empuje).
          #
          # Antes esto era `git pull --rebase || true`, y ese `|| true` era una
          # trampa: al chocar dejaba el repo A MEDIO REBASE, en detached HEAD, y
          # el push moría con "You are not currently on a branch" — build en rojo
          # y web sin publicar. Pasó el 2026-08-04.
          git fetch origin main
          if ! git rebase origin/main; then
            # Los conflictos solo pueden estar en ficheros GENERADOS (web/, data/),
            # que este build acaba de rehacer enteros: vale nuestra versión.
            # OJO con la inversión de git: durante un rebase, --theirs es el commit
            # que se está aplicando (el nuestro), no el de origin.
            git checkout --theirs -- web/ data/ 2>/dev/null || true
            git add -A
            # Si el conflicto NO era de ficheros generados, esto falla a
            # propósito: un choque de código de verdad tiene que verse.
            GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
          fi
          git push
